name: Linux acceptance
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['**.php', 'tests/**', '.github/workflows/acceptance.yml']
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3', '8.4', '8.5']
        redis: ['7']
        include:
          - php: '8.3'
            redis: '6'
          - php: '8.3'
            redis: '8'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: harborcache
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:${{ matrix.redis }}
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_ROOT: /tmp/harborcache-wordpress
      HC_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, redis, igbinary, lzf, lz4, zstd
          coverage: none
          tools: wp-cli
      - name: Syntax and isolated MySQL installation
        shell: bash
        run: |
          set -euo pipefail
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/syntax.log
          wp core download --path="$WP_ROOT"
          wp config create --path="$WP_ROOT" --dbname=harborcache --dbuser=root --dbpass=local-ci-only --dbhost=127.0.0.1:3306
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ROOT"
          wp core install --path="$WP_ROOT" --url=http://localhost --title='HarborCache CI' --admin_user=ci --admin_password=ci-disposable-only --admin_email=ci@example.org --skip-email
          mkdir -p "$WP_ROOT/wp-content/plugins/harborcache"
          rsync -a --exclude=.git --exclude=media --exclude=dist --exclude=tests --exclude=.github ./ "$WP_ROOT/wp-content/plugins/harborcache/"
          wp plugin activate harborcache --path="$WP_ROOT"
          cp includes/object-cache.php "$WP_ROOT/wp-content/object-cache.php"
      - name: Native and PHP clients, codecs, concurrent workers and WordPress flows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for client in predis phpredis credis; do
            export HC_TEST_CONFIG="{\"client\":\"$client\"}"
            php tests/acceptance.php | tee "evidence/$client.txt"
          done
          for serializer in php igbinary; do
            for compression in none lzf lz4 zstd; do
              php -r "exit(('$serializer'==='php'||function_exists('igbinary_serialize'))&&('$compression'==='none'||function_exists('${compression}_compress'))?0:1);" || { echo "Unavailable $serializer/$compression" | tee -a evidence/unavailable.txt; continue; }
              export HC_TEST_CONFIG="{\"client\":\"phpredis\",\"serializer\":\"$serializer\",\"compression\":\"$compression\",\"persistent\":true}"
              php tests/acceptance.php | tee "evidence/codec-$serializer-$compression.txt"
            done
          done
      - name: Outage and restart recovery
        shell: bash
        run: |
          set -euo pipefail
          export HC_TEST_CONFIG='{"client":"phpredis","timeout":0.2,"read_timeout":0.2}'
          docker stop '${{ job.services.redis.id }}'
          php tests/acceptance.php down | tee evidence/outage.txt
          docker start '${{ job.services.redis.id }}'
          for attempt in $(seq 1 30); do docker exec '${{ job.services.redis.id }}' redis-cli ping && break || sleep 1; done
          php tests/acceptance.php recovery | tee evidence/recovery.txt
      - name: Real ACL, trusted TLS, rejected certificate and Unix socket
        shell: bash
        run: |
          set -euo pipefail
          docker exec '${{ job.services.redis.id }}' redis-cli ACL SETUSER hc-ci on '>disposable-ci-only' '~*' '+@all'
          for client in predis phpredis; do
            export HC_TEST_CONFIG="{\"client\":\"$client\",\"username\":\"hc-ci\",\"password\":\"disposable-ci-only\"}"
            php tests/acceptance.php | tee "evidence/acl-$client.txt"
          done
          mkdir -p /tmp/hc-redis
          chmod 777 /tmp/hc-redis
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/hc-redis/key.pem -out /tmp/hc-redis/cert.pem -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 644 /tmp/hc-redis/*.pem
          docker run -d --name hc-tls -p 6380:6380 -v /tmp/hc-redis:/hc redis:${{ matrix.redis }} redis-server --port 0 --tls-port 6380 --tls-cert-file /hc/cert.pem --tls-key-file /hc/key.pem --tls-ca-cert-file /hc/cert.pem --tls-auth-clients no --unixsocket /hc/redis.sock --unixsocketperm 777
          for attempt in $(seq 1 30); do test -S /tmp/hc-redis/redis.sock && break || sleep 1; done
          for client in predis phpredis; do
            export HC_TEST_CONFIG="{\"client\":\"$client\",\"scheme\":\"tls\",\"port\":6380,\"tls_options\":{\"cafile\":\"/tmp/hc-redis/cert.pem\",\"verify_peer\":true,\"verify_peer_name\":true}}"
            php tests/acceptance.php | tee "evidence/tls-$client.txt"
            export HC_TEST_CONFIG="{\"client\":\"$client\",\"scheme\":\"tls\",\"port\":6380,\"tls_options\":{\"verify_peer\":true,\"verify_peer_name\":true}}"
            php tests/acceptance.php down | tee "evidence/untrusted-tls-$client.txt"
            export HC_TEST_CONFIG="{\"client\":\"$client\",\"host\":\"/tmp/hc-redis/redis.sock\"}"
            php tests/acceptance.php | tee "evidence/socket-$client.txt"
          done
      - name: WordPress lifecycle and scheduled event execution
        shell: bash
        run: |
          set -euo pipefail
          wp cron event run --due-now --path="$WP_ROOT" | tee evidence/cron.txt
          wp plugin deactivate harborcache --path="$WP_ROOT" | tee evidence/deactivate.txt
          wp plugin activate harborcache --path="$WP_ROOT" | tee evidence/reactivate.txt
          cp includes/object-cache.php "$WP_ROOT/wp-content/object-cache.php"
          export HC_TEST_CONFIG='{"client":"phpredis"}'
          php tests/acceptance.php recovery | tee evidence/lifecycle-recovery.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-php-${{ matrix.php }}-redis-${{ matrix.redis }}
          path: evidence/

  integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: harborcache
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_ROOT: /tmp/harborcache-wordpress
      HC_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mysqli, redis, igbinary, lzf, lz4, zstd
          coverage: none
          tools: wp-cli
      - name: Syntax and isolated MySQL installation
        shell: bash
        run: |
          set -euo pipefail
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/syntax.log
          wp core download --path="$WP_ROOT"
          wp config create --path="$WP_ROOT" --dbname=harborcache --dbuser=root --dbpass=local-ci-only --dbhost=127.0.0.1:3306
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ROOT"
          wp core install --path="$WP_ROOT" --url=http://localhost --title='HarborCache CI' --admin_user=ci --admin_password=ci-disposable-only --admin_email=ci@example.org --skip-email
          mkdir -p "$WP_ROOT/wp-content/plugins/harborcache"
          rsync -a --exclude=.git --exclude=media --exclude=dist --exclude=tests --exclude=.github ./ "$WP_ROOT/wp-content/plugins/harborcache/"
          wp plugin activate harborcache --path="$WP_ROOT"
          cp includes/object-cache.php "$WP_ROOT/wp-content/object-cache.php"

      - name: Equal-workload Linux performance comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence /tmp/hc-baseline
          wp plugin deactivate harborcache --path="$WP_ROOT"
          wp plugin install redis-cache --version=3.0.0 --path="$WP_ROOT"
          curl -fsSL https://github.com/shahidirfan100/harborcache/releases/download/v1.1.2/harborcache-1.1.2.zip -o /tmp/hc-baseline.zip
          echo 'f9f578f8504e7ad7cb3833024e99504666932e57a3f7d53a63ab4add39957adb  /tmp/hc-baseline.zip' | sha256sum -c -
          unzip -q /tmp/hc-baseline.zip -d /tmp/hc-baseline
          for round in $(seq 0 6); do
            for offset in 0 1 2; do
              engines=(free baseline harbor)
              engine=${engines[$(((round+offset)%3))]}
              case "$engine" in
                free) source="$WP_ROOT/wp-content/plugins/redis-cache" ;;
                baseline) source=/tmp/hc-baseline/harborcache ;;
                harbor) source="$GITHUB_WORKSPACE" ;;
              esac
              cp "$source/includes/object-cache.php" "$WP_ROOT/wp-content/object-cache.php"
              php tests/benchmark.php "$engine" "$source" "$round" 0 | tee -a evidence/benchmark.jsonl
            done
          done
          cp includes/object-cache.php "$WP_ROOT/wp-content/object-cache.php"
          for sampling in 10 100; do php tests/benchmark.php harbor "$GITHUB_WORKSPACE" 100 "$sampling" | tee -a evidence/benchmark-sampling.jsonl; done
          rm "$WP_ROOT/wp-content/object-cache.php"
          wp plugin activate harborcache --path="$WP_ROOT"
          cp includes/object-cache.php "$WP_ROOT/wp-content/object-cache.php"
      - name: WooCommerce checkout, inventory and orders
        shell: bash
        run: |
          set -euo pipefail
          wp plugin install woocommerce --activate --path="$WP_ROOT"
          php tests/applications.php woocommerce | tee evidence/woocommerce.txt
          wp plugin deactivate woocommerce --path="$WP_ROOT"
      - name: Real WordPress multisite and scoped invalidation
        shell: bash
        run: |
          set -euo pipefail
          wp core multisite-convert --title='HarborCache network' --path="$WP_ROOT"
          wp plugin activate harborcache --network --path="$WP_ROOT"
          cp includes/object-cache.php "$WP_ROOT/wp-content/object-cache.php"
          php tests/applications.php multisite | tee evidence/multisite.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-performance-applications
          path: evidence/
