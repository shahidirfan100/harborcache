name: Linux acceptance
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['**.php', 'assets/**', 'tests/**', 'tools/**', '.distignore', 'dist/**', 'readme.txt', '.github/workflows/acceptance.yml']
permissions:
  contents: read
jobs:
  review-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: harborcache
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_ROOT: /tmp/hc-review-core
      HC_CONTENT: /tmp/hc-review-content
      HC_EXTENSIONS: /tmp/hc-review-extensions
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, redis
          coverage: none
          tools: wp-cli
      - name: Exact ZIP in relocated content and plugin directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HC_CONTENT" "$HC_EXTENSIONS"
          python3 tools/build-release.py --verify | tee evidence/package.json
          wp core download --path="$WP_ROOT"
          cp -a "$WP_ROOT/wp-content/themes" "$HC_CONTENT/themes"
          wp config create --path="$WP_ROOT" --dbname=harborcache --dbuser=root --dbpass=local-ci-only --dbhost=127.0.0.1:3306
          wp config set WP_CONTENT_DIR "$HC_CONTENT" --path="$WP_ROOT"
          wp config set WP_CONTENT_URL http://localhost/content-moved --path="$WP_ROOT"
          wp config set WP_PLUGIN_DIR "$HC_EXTENSIONS" --path="$WP_ROOT"
          wp config set WP_PLUGIN_URL http://localhost/extensions-moved --path="$WP_ROOT"
          wp config set WP_DEBUG true --raw --path="$WP_ROOT"
          wp config set WP_DEBUG_LOG true --raw --path="$WP_ROOT"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ROOT"
          wp core install --path="$WP_ROOT" --url=http://localhost --title='HarborCache review' --admin_user=ci --admin_password=ci-disposable-only --admin_email=ci@example.org --skip-email
          unzip -q dist/harborcache-*.zip -d "$HC_EXTENSIONS"
          wp plugin activate harborcache-object-cache-with-redis --path="$WP_ROOT"
          wp plugin install plugin-check --activate --path="$WP_ROOT"
          wp plugin check harborcache-object-cache-with-redis --slug=harborcache-object-cache-with-redis --format=json --require="$HC_EXTENSIONS/plugin-check/cli.php" --path="$WP_ROOT" | tee evidence/plugin-check.json
          python3 tools/check-plugin-report.py evidence/plugin-check.json
          wp harborcache enable --path="$WP_ROOT"
          wp eval-file tests/review-wordpress.php --path="$WP_ROOT" | tee evidence/custom-layout.txt
          wp eval '$active=get_option("active_plugins"); $active=array_map(static function($p){return str_replace("harborcache-object-cache-with-redis/","cache-renamed/",$p);},$active); update_option("active_plugins",$active);' --path="$WP_ROOT"
          mv "$HC_EXTENSIONS/harborcache-object-cache-with-redis" "$HC_EXTENSIONS/cache-renamed"
          wp eval 'if($GLOBALS["wp_object_cache"] instanceof HarborCache_Advanced_Cache){throw new RuntimeException("Expected safe fallback after a directory move");} echo "PASS Safe WordPress bootstrap after rename\n";' --path="$WP_ROOT" | tee evidence/rename-fallback.txt
          wp harborcache update --path="$WP_ROOT"
          wp eval-file tests/review-wordpress.php --path="$WP_ROOT" | tee evidence/renamed-layout.txt
          wp plugin deactivate cache-renamed --path="$WP_ROOT"
          test ! -e "$HC_CONTENT/object-cache.php"
          wp plugin uninstall cache-renamed --path="$WP_ROOT"
          if test -s "$HC_CONTENT/debug.log"; then cat "$HC_CONTENT/debug.log"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-review-layout
          path: evidence
  wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3', '8.4', '8.5']
        redis: ['7']
        wp: ['latest']
        include:
          - php: '7.4'
            redis: '7'
            wp: '6.6'
          - php: '8.3'
            redis: '6'
          - php: '8.3'
            redis: '8'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: harborcache
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:${{ matrix.redis }}
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_ROOT: /tmp/harborcache-wordpress
      HC_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, redis, igbinary, lzf, lz4, zstd
          coverage: none
          tools: wp-cli
      - name: Syntax and isolated MySQL installation
        shell: bash
        run: |
          set -euo pipefail
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/syntax.log
          php tests/dropin-writer.php
          php tests/review-regressions.php
          php tests/safety-regressions.php
          python3 tools/build-release.py --check
          php tests/conflict-notice.php
          wp core download --version="${{ matrix.wp || 'latest' }}" --path="$WP_ROOT"
          wp config create --path="$WP_ROOT" --dbname=harborcache --dbuser=root --dbpass=local-ci-only --dbhost=127.0.0.1:3306
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ROOT"
          wp core install --path="$WP_ROOT" --url=http://localhost --title='HarborCache CI' --admin_user=ci --admin_password=ci-disposable-only --admin_email=ci@example.org --skip-email
          mkdir -p "$WP_ROOT/wp-content/plugins/harborcache"
          rsync -a --exclude=.git --exclude=media --exclude=dist --exclude=tests --exclude=.github ./ "$WP_ROOT/wp-content/plugins/harborcache/"
          wp plugin activate harborcache --path="$WP_ROOT"
          php tests/install-dropin.php "$WP_ROOT/wp-content/plugins/harborcache"
      - name: Native and PHP clients, codecs, concurrent workers and WordPress flows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for client in predis phpredis credis; do
            export HC_TEST_CONFIG="{\"client\":\"$client\"}"
            php tests/acceptance.php | tee "evidence/$client.txt"
          done
          for serializer in php igbinary; do
            for compression in none lzf lz4 zstd; do
              php -r "exit(('$serializer'==='php'||function_exists('igbinary_serialize'))&&('$compression'==='none'||function_exists('${compression}_compress'))?0:1);" || { echo "Unavailable $serializer/$compression" | tee -a evidence/unavailable.txt; continue; }
              export HC_TEST_CONFIG="{\"client\":\"phpredis\",\"serializer\":\"$serializer\",\"compression\":\"$compression\",\"persistent\":true}"
              php tests/acceptance.php | tee "evidence/codec-$serializer-$compression.txt"
            done
          done
      - name: Outage and restart recovery
        shell: bash
        run: |
          set -euo pipefail
          export HC_TEST_CONFIG='{"client":"phpredis","timeout":0.2,"read_timeout":0.2}'
          docker stop '${{ job.services.redis.id }}'
          php tests/acceptance.php down | tee evidence/outage.txt
          docker start '${{ job.services.redis.id }}'
          for attempt in $(seq 1 30); do docker exec '${{ job.services.redis.id }}' redis-cli ping && break || sleep 1; done
          php tests/acceptance.php recovery | tee evidence/recovery.txt
      - name: Restricted ACL and prefix isolation
        shell: bash
        run: |
          set -euo pipefail
          for client in predis phpredis; do
            export HC_SAFETY_CLIENT="$client"
            php tests/safety-live.php restricted | tee "evidence/restricted-$client.txt"
            php tests/safety-live.php namespace | tee "evidence/namespace-$client.txt"
          done
          HC_SAFETY_CLIENT=phpredis php tests/safety-live.php reconnect | tee evidence/reconnect-phpredis.txt
      - name: Real ACL, trusted TLS, rejected certificate and Unix socket
        shell: bash
        run: |
          set -euo pipefail
          run_transport_acceptance() {
            local label="$1"
            local logfile="$2"
            shift 2
            echo "BEGIN transport probe: $label"
            timeout --signal=TERM --kill-after=10s 90s php "$@" | tee "$logfile"
            echo "PASS transport probe: $label"
          }
          docker exec '${{ job.services.redis.id }}' redis-cli ACL SETUSER hc-ci on '>disposable-ci-only' '~*' '+@all'
          for client in predis phpredis; do
            export HC_TEST_CONFIG="{\"client\":\"$client\",\"username\":\"hc-ci\",\"password\":\"disposable-ci-only\"}"
            run_transport_acceptance "ACL $client" "evidence/acl-$client.txt" tests/acceptance.php transport
          done
          mkdir -p /tmp/hc-redis
          chmod 777 /tmp/hc-redis
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/hc-redis/key.pem -out /tmp/hc-redis/cert.pem -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 644 /tmp/hc-redis/*.pem
          docker run -d --name hc-tls -p 6380:6380 -v /tmp/hc-redis:/hc redis:${{ matrix.redis }} redis-server --port 0 --tls-port 6380 --tls-cert-file /hc/cert.pem --tls-key-file /hc/key.pem --tls-ca-cert-file /hc/cert.pem --tls-auth-clients no --unixsocket /hc/redis.sock --unixsocketperm 777
          for attempt in $(seq 1 30); do test -S /tmp/hc-redis/redis.sock && break || sleep 1; done
          if ! test -S /tmp/hc-redis/redis.sock; then docker logs hc-tls; exit 1; fi
          HC_TLS_CA=/tmp/hc-redis/cert.pem timeout --signal=TERM --kill-after=2s 15s php tests/phpredis-tls-smoke.php
          for client in predis phpredis; do
            export HC_TEST_CONFIG="{\"client\":\"$client\",\"scheme\":\"tls\",\"port\":6380,\"tls_options\":{\"cafile\":\"/tmp/hc-redis/cert.pem\",\"verify_peer\":true,\"verify_peer_name\":true}}"
            run_transport_acceptance "trusted TLS $client" "evidence/tls-$client.txt" tests/acceptance.php transport
            if [[ '${{ matrix.php }}' == '7.4' && "$client" == phpredis ]]; then
              for round in $(seq 1 5); do
                run_transport_acceptance "PHP 7.4 trusted TLS repeat $round" "evidence/tls-php74-repeat-$round.txt" tests/acceptance.php transport
              done
            fi
            export HC_TEST_CONFIG="{\"client\":\"$client\",\"scheme\":\"tls\",\"port\":6380,\"tls_options\":{\"verify_peer\":true,\"verify_peer_name\":true}}"
            run_transport_acceptance "untrusted TLS rejection $client" "evidence/untrusted-tls-$client.txt" tests/acceptance.php down
            export HC_TEST_CONFIG="{\"client\":\"$client\",\"host\":\"/tmp/hc-redis/redis.sock\"}"
            run_transport_acceptance "Unix socket $client" "evidence/socket-$client.txt" tests/acceptance.php transport
          done
      - name: WordPress lifecycle and scheduled event execution
        shell: bash
        run: |
          set -euo pipefail
          wp cron event run --due-now --path="$WP_ROOT" | tee evidence/cron.txt
          wp plugin deactivate harborcache --path="$WP_ROOT" | tee evidence/deactivate.txt
          wp plugin activate harborcache --path="$WP_ROOT" | tee evidence/reactivate.txt
          php tests/install-dropin.php "$WP_ROOT/wp-content/plugins/harborcache"
          export HC_TEST_CONFIG='{"client":"phpredis"}'
          php tests/acceptance.php recovery | tee evidence/lifecycle-recovery.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-php-${{ matrix.php }}-redis-${{ matrix.redis }}-wp-${{ matrix.wp || 'latest' }}
          path: evidence/

  integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: harborcache
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_ROOT: /tmp/harborcache-wordpress
      HC_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mysqli, redis, igbinary, lzf, lz4, zstd, relay, msgpack
          ini-values: relay.maxmemory=32M
          coverage: none
          tools: wp-cli
      - name: Syntax and isolated MySQL installation
        shell: bash
        run: |
          set -euo pipefail
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/syntax.log
          wp core download --path="$WP_ROOT"
          wp config create --path="$WP_ROOT" --dbname=harborcache --dbuser=root --dbpass=local-ci-only --dbhost=127.0.0.1:3306
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ROOT"
          wp core install --path="$WP_ROOT" --url=http://localhost --title='HarborCache CI' --admin_user=ci --admin_password=ci-disposable-only --admin_email=ci@example.org --skip-email
          mkdir -p "$WP_ROOT/wp-content/plugins/harborcache"
          rsync -a --exclude=.git --exclude=media --exclude=dist --exclude=tests --exclude=.github ./ "$WP_ROOT/wp-content/plugins/harborcache/"
          wp plugin activate harborcache --path="$WP_ROOT"
          php tests/install-dropin.php "$WP_ROOT/wp-content/plugins/harborcache"

      - name: Equal-workload Linux performance comparison
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence /tmp/hc-baseline
          wp plugin deactivate harborcache --path="$WP_ROOT"
          wp plugin install redis-cache --version=3.0.0 --path="$WP_ROOT"
          git fetch --depth=1 origin 44cf7cfdb1593172d530d0917fd19f8349863364
          git show 44cf7cfdb1593172d530d0917fd19f8349863364:dist/harborcache-1.2.5.zip > /tmp/hc-baseline.zip
          echo 'f137b1efd444acccd4dcddc5dba925da1c230d58a9d4bbadaeadc8b22f2de480  /tmp/hc-baseline.zip' | sha256sum -c -
          unzip -q /tmp/hc-baseline.zip -d /tmp/hc-baseline
          for round in $(seq 0 6); do
            for offset in 0 1 2; do
              engines=(free baseline harbor)
              engine=${engines[$(((round+offset)%3))]}
              case "$engine" in
                free) source="$WP_ROOT/wp-content/plugins/redis-cache" ;;
                baseline) source=/tmp/hc-baseline/harborcache-object-cache-with-redis ;;
                harbor) source="$GITHUB_WORKSPACE" ;;
              esac
              php tests/install-dropin.php "$source"
              php tests/benchmark.php "$engine" "$source" "$round" 0 | tee -a evidence/benchmark.jsonl
            done
          done
          for engine in free baseline harbor; do
            case "$engine" in
              free) source="$WP_ROOT/wp-content/plugins/redis-cache" ;;
              baseline) source=/tmp/hc-baseline/harborcache-object-cache-with-redis ;;
              harbor) source="$GITHUB_WORKSPACE" ;;
            esac
            php tests/install-dropin.php "$source"
            php tests/benchmark-flush.php "$engine" "$source" 5 | tee -a evidence/group-flush.jsonl
          done
          php tests/install-dropin.php "$WP_ROOT/wp-content/plugins/harborcache"
          for sampling in 10 100; do php tests/benchmark.php harbor "$GITHUB_WORKSPACE" 100 "$sampling" | tee -a evidence/benchmark-sampling.jsonl; done
          rm "$WP_ROOT/wp-content/object-cache.php"
          wp plugin activate harborcache --path="$WP_ROOT"
          php tests/install-dropin.php "$WP_ROOT/wp-content/plugins/harborcache"
      - name: Critical options with a controlled stale read node
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name hc-safety-read-node --network host redis:7 redis-server --bind 127.0.0.1 --port 6381 --save '' --appendonly no
          for attempt in $(seq 1 30); do docker exec hc-safety-read-node redis-cli -p 6381 ping && break || sleep 1; done
          for client in predis phpredis; do
            HC_SAFETY_CLIENT="$client" php tests/safety-live.php routing | tee "evidence/critical-routing-$client.txt"
          done
          docker rm -f hc-safety-read-node
      - name: WooCommerce checkout, inventory and orders
        shell: bash
        run: |
          set -euo pipefail
          wp plugin install woocommerce --activate --path="$WP_ROOT"
          php tests/applications.php woocommerce | tee evidence/woocommerce.txt
          wp plugin deactivate woocommerce --path="$WP_ROOT"
      - name: Real WordPress multisite and scoped invalidation
        shell: bash
        run: |
          set -euo pipefail
          wp core multisite-convert --title='HarborCache network' --path="$WP_ROOT"
          wp plugin activate harborcache --network --path="$WP_ROOT"
          php tests/install-dropin.php "$WP_ROOT/wp-content/plugins/harborcache"
          php tests/applications.php multisite | tee evidence/multisite.txt
      - name: Concurrent PHP-FPM HTTP smoke and recovery
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-fpm nginx
          cp tests/http.php "$WP_ROOT/wp-content/hc-http.php"
          sudo chown -R www-data:www-data "$WP_ROOT"
          printf '%s\n' 'server { listen 8080; server_name localhost; root /tmp/harborcache-wordpress; location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass unix:/run/php/php8.3-fpm.sock; } }' | sudo tee /etc/nginx/sites-enabled/harborcache-ci
          sudo systemctl restart php8.3-fpm nginx
          curl -fsS -H 'Host: localhost' 'http://127.0.0.1:8080/wp-content/hc-http.php?init=1'
          export HTTP_EVIDENCE="$GITHUB_WORKSPACE/evidence"
          seq 1 160 | xargs -P8 -I{} sh -c 'curl -fsS -H "Host: localhost" -w "\n%{time_total}\n" http://127.0.0.1:8080/wp-content/hc-http.php > "$HTTP_EVIDENCE/http-{}.txt"'
          curl -fsS -H 'Host: localhost' 'http://127.0.0.1:8080/wp-content/hc-http.php?summary=1' | tee evidence/http-summary.json
          python3 - <<'PY'
          import json, pathlib
          rows=[p.read_text().splitlines() for p in pathlib.Path('evidence').glob('http-[0-9]*.txt')]
          assert len(rows)==160 and all(json.loads(x[0])['ok'] for x in rows)
          assert json.loads(pathlib.Path('evidence/http-summary.json').read_text())['requests']==160
          times=sorted(float(x[1])*1000 for x in rows)
          print(json.dumps({'requests':160,'concurrency':8,'http_p50_ms':times[79],'http_p95_ms':times[151],'http_p99_ms':times[158],'limitations':'Short isolated PHP-FPM smoke; not sustained production load or free-plugin HTTP comparison'}))
          PY
          sudo systemctl restart php8.3-fpm
          curl -fsS -H 'Host: localhost' 'http://127.0.0.1:8080/wp-content/hc-http.php?summary=1' | tee evidence/http-after-fpm-restart.json
          php -r '$s=json_decode(file_get_contents("evidence/http-after-fpm-restart.json"),true);if($s["requests"]!==160){exit(1);}echo "PASS Persistent values survive FPM restart\n";'
      - name: Real Relay extension and concurrent option updates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          php --ri relay | tee evidence/relay-extension.txt
          export HC_TEST_CONFIG='{"client":"relay","prefix":"hc-relay-ci","database":15,"debug":true,"relay":{"listeners":true}}'
          php tests/acceptance.php | tee evidence/relay.txt
          export HC_TEST_CONFIG='{"client":"relay","prefix":"hc-relay-adaptive-ci","database":15,"relay":{"listeners":true,"adaptive":{"width":512,"depth":1}}}'
          php tests/acceptance.php | tee evidence/relay-adaptive.txt
          HC_SAFETY_CLIENT=relay php tests/safety-live.php reconnect | tee evidence/reconnect-relay.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-performance-applications
          path: evidence/
